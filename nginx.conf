# Keep the CapRover default subdomain out of search engines (a-w-c.co.uk is the real site)
map $host $awc_robots {
  ~apps\.simontingle\.com$  "noindex, nofollow";
  default                   "";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Security headers (declared at server level; locations below must not use add_header or these are dropped)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; media-src 'self'; form-action 'self' https://api.web3forms.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
  add_header X-Robots-Tag $awc_robots always;

  location ~* \.(jpg|jpeg|png|webm|css|js)$ { expires 30d; }
  location / { try_files $uri $uri/ $uri.html =404; }
}
